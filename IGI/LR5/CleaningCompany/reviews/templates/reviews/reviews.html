{% extends 'base_generic.html' %}

{% block title %}<title>Reviews</title>{% endblock%}
{% block content %}
    <h2>Reviews</h2>
    {% for review in reviews %}
        <h4>Username: {{review.user.username}}</h4>
        <p>Score: {{review.score}}</p>
        <p>{{review.text}}</p>
        <p>{{review.created_at}}</p>
    {% endfor %}

    <button><a href="{% url 'create_review' %}">Add review</a></button>
{% endblock %}
