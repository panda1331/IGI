{% extends 'base_generic.html' %}

{% block title %}<title>Create Category</title>{% endblock %}
{% block content %}
    <h2>Create Category</h2>
    <form method="post">
        {% csrf_token %}
        <label for="name">Enter name: </label>
        <input id="name" name="name" type="text" spellcheck="true"><br><br>
        <button type="submit">Save</button>
        <button type="button"><a href="{% url 'catalog' %}">Cancel</a></button>
    </form>
{% endblock %}
