{% extends 'base_generic.html' %}

{% block title %}<title>Service Info</title>{% endblock %}
{% block content %}
    <article class="service-detail">
        <h1>Service Info</h1>
        <header>
            <h2>{{ service.name }}</h2>
        </header>

        <dl>
            <dt>Category:</dt>
            <dd>{{ service.category.name }}</dd>

            <dt>Description:</dt>
            <dd>{{ service.description }}</dd>

            <dt>Price:</dt>
            <dd><strong>{{ service.price }} BYN</strong></dd>
        </dl>

        <form action="{% url 'add_to_cart' service.id %}" method="post">
            {% csrf_token %}
            <button type="submit">
                🛒 Add to cart
            </button>
        </form>
    </article>
    

{% endblock %}
