{% extends 'base_generic.html' %}

{% block title %}<title>Employee Clients</title>{% endblock %}
{% block content %}
    <h1>Employee Clients</h1>
    <form method="get">
        <select name="employee_id">
            {% for emp in employees %}
                <option value="{{ emp.id }}" {% if request.GET.employee_id == emp.id|stringformat:"s" %}selected{% endif %}>
                    {{ emp.get_full_name }}
                </option>
            {% endfor %}
        </select>
        <button type="submit">Show</button>
    </form>
    {% if clients is not None %}
        <ul>
            {% for client in clients %}
                <li>{{ client.get_full_name }}</li>
            {% empty %}
                <li>No clients found.</li>
            {% endfor %}
        </ul>
    {% endif %}
<hr>
{% endblock %}
