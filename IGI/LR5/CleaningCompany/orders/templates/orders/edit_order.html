{% extends 'base_generic.html' %}

{% block title %}<title>Edit Order</title>{% endblock%}
{% block content %}
    <section class="order-edit-section">
        <h1>Edit Order #{{ order.id }}</h1>

        <form method="post" class="order-form">
            {% csrf_token %}

            <fieldset>
                <legend>Order Details</legend>

                <p>
                    <label for="address">Address:</label>
                    <input id="address" type="text" name="address" value="{{ order.address }}" required>
                </p>

                <p>
                    <label for="work_date">Work Date:</label>
                    <input id="work_date" type="date" name="work_date" value="{{ order.work_date|date:'Y-m-d' }}" required>
                </p>

                <p>
                    <label for="employee">Assigned Employee:</label>
                    <select id="employee" name="employee">
                        {% for employee in employees %}
                            <option value="{{ employee.id }}" {% if employee.id == order.employee.id %}selected{% endif %}>
                                {{ employee.get_full_name|default:employee.username }}
                            </option>
                        {% endfor %}
                    </select>
                </p>

                <p>
                    <label for="status">Status:</label>
                    <select id="status" name="status">
                        <option value="issued" {% if order.status == 'issued' %}selected{% endif %}>Issued</option>
                        <option value="processing" {% if order.status == 'processing' %}selected{% endif %}>Processing</option>
                        <option value="completed" {% if order.status == 'completed' %}selected{% endif %}>Completed</option>
                        <option value="canceled" {% if order.status == 'canceled' %}selected{% endif %}>Canceled</option>
                    </select>
                </p>
            </fieldset>

            <div class="form-actions">
                <button type="submit">Save Changes</button>
                <a href="{% url 'order_list' %}" class="button-cancel">Cancel</a>
            </div>
        </form>
    </section>
{% endblock %}
