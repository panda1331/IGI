{% extends 'base_generic.html' %}
{% load static %}

{% block title %}<title>Employees Directory</title>{% endblock %}

{% block content %}
<section class="contacts-table-section">
    <h1 class="section-title">Employees Directory</h1>

    <div id="table-preloader" class="preloader-overlay hidden">
        <div class="preloader">
            <div class="line line1">
                <span class="circle circle-top"></span>
                <div class="dotted">
                    <span class="dot dot-top"></span>
                    <span class="dot dot-middle-top"></span>
                    <span class="dot dot-middle-bottom"></span>
                    <span class="dot dot-bottom"></span>
                </div>
                <span class="circle circle-bottom"></span>
            </div>
            <div class="line line2">
                <span class="circle circle-top"></span>
                <div class="dotted">
                    <span class="dot dot-top"></span>
                    <span class="dot dot-middle-top"></span>
                    <span class="dot dot-middle-bottom"></span>
                    <span class="dot dot-bottom"></span>
                </div>
                <span class="circle circle-bottom"></span>
            </div>
            <div class="line line3">
                <span class="circle circle-top"></span>
                <div class="dotted">
                    <span class="dot dot-top"></span>
                    <span class="dot dot-middle-top"></span>
                    <span class="dot dot-middle-bottom"></span>
                    <span class="dot dot-bottom"></span>
                </div>
                <span class="circle circle-bottom"></span>
            </div>
            <div class="line line4">
                <span class="circle circle-top"></span>
                <div class="dotted">
                    <span class="dot dot-top"></span>
                    <span class="dot dot-middle-top"></span>
                    <span class="dot dot-middle-bottom"></span>
                    <span class="dot dot-bottom"></span>
                </div>
                <span class="circle circle-bottom"></span>
            </div>
            <div class="line line5">
                <span class="circle circle-top"></span>
                <div class="dotted">
                    <span class="dot dot-top"></span>
                    <span class="dot dot-middle-top"></span>
                    <span class="dot dot-middle-bottom"></span>
                    <span class="dot dot-bottom"></span>
                </div>
                <span class="circle circle-bottom"></span>
            </div>
            <div class="line line6">
                <span class="circle circle-top"></span>
                <div class="dotted">
                    <span class="dot dot-top"></span>
                    <span class="dot dot-middle-top"></span>
                    <span class="dot dot-middle-bottom"></span>
                    <span class="dot dot-bottom"></span>
                </div>
                <span class="circle circle-bottom"></span>
            </div>
            <div class="line line7">
                <span class="circle circle-top"></span>
                <div class="dotted">
                    <span class="dot dot-top"></span>
                    <span class="dot dot-middle-top"></span>
                    <span class="dot dot-middle-bottom"></span>
                    <span class="dot dot-bottom"></span>
                </div>
                <span class="circle circle-bottom"></span>
            </div>
            <div class="line line8">
                <span class="circle circle-top"></span>
                <div class="dotted">
                    <span class="dot dot-top"></span>
                    <span class="dot dot-middle-top"></span>
                    <span class="dot dot-middle-bottom"></span>
                    <span class="dot dot-bottom"></span>
                </div>
                <span class="circle circle-bottom"></span>
            </div>
            <div class="line line9">
                <span class="circle circle-top"></span>
                <div class="dotted">
                    <span class="dot dot-top"></span>
                    <span class="dot dot-middle-top"></span>
                    <span class="dot dot-middle-bottom"></span>
                    <span class="dot dot-bottom"></span>
                </div>
                <span class="circle circle-bottom"></span>
            </div>
            <div class="line line10">
                <span class="circle circle-top"></span>
                <div class="dotted">
                    <span class="dot dot-top"></span>
                    <span class="dot dot-middle-top"></span>
                    <span class="dot dot-middle-bottom"></span>
                    <span class="dot dot-bottom"></span>
                </div>
                <span class="circle circle-bottom"></span>
            </div>
            <div class="line line11">
                <span class="circle circle-top"></span>
                <div class="dotted">
                    <span class="dot dot-top"></span>
                    <span class="dot dot-middle-top"></span>
                    <span class="dot dot-middle-bottom"></span>
                    <span class="dot dot-bottom"></span>
                </div>
                <span class="circle circle-bottom"></span>
            </div>
        </div>   
    </div>

    <div class="table-controls">
        <button id="btn-open-form" class="button">Add Employee</button>
        
        <div class="filter-group">
            <input type="text" id="filter-input" placeholder="Enter text">
            <button id="btn-filter" class="button">Find</button>
        </div>
        
        <button id="btn-bonus" class="button button--bonus">Pay Bonus</button>
    </div>

    <form id="add-contact-form" class="add-form hidden" enctype="multipart/form-data">
        {% csrf_token %}
        <h3>New Employee</h3>
        <input type="text" id="new-fullname" placeholder="Full Name" required>
        <input type="file" id="new-photo" accept="image/*" required> 
        <input type="text" id="new-website" placeholder="Website URL (ends with .php or .html)" required>
        <input type="text" id="new-description" placeholder="Work Description" required>
        <input type="text" id="new-phone" placeholder="Phone (e.g., +375 (29) 111-22-33)" required>
        <input type="email" id="new-email" placeholder="Email" required>
        
        <div id="form-error-msg" class="form-error"></div>
        
        <div class="form-actions">
            <button type="submit" id="btn-add-to-table" class="button" disabled>Add to Table</button>
            <button type="button" id="btn-close-form" class="button-cancel">Cancel</button>
        </div>
    </form>

    <table class="data-table">
        <thead>
            <tr>
                <th><input type="checkbox" id="select-all"></th>
                <th data-sort="full_name">Full Name <span class="sort-icon"></span></th>
                <th data-sort="description">Description <span class="sort-icon"></span></th>
                <th data-sort="phone">Phone <span class="sort-icon"></span></th>
                <th data-sort="email">Email <span class="sort-icon"></span></th>
            </tr>
        </thead>
        <tbody id="table-body">
        </tbody>
    </table>

    <div id="table-pagination" class="pagination"></div>

    <div id="row-details" class="row-details hidden">
        <h3>Employee Details</h3>
        <div id="details-content"></div>
    </div>

    <div id="bonus-result" class="bonus-result hidden"></div>
</section>

<script src="{% static 'js/contacts-table.js' %}" defer></script>
{% endblock %}
